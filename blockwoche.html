<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockwoche</title><style>

:root{
  --bg:#f4f7fa;--paper:#fff;--ink:#162533;--muted:#647686;
  --navy:#132e46;--blue:#23658b;--cyan:#2f8da6;--accent:#e49a34;
  --line:#dce5ec;--soft:#eaf2f7;--green:#4f8066;--future:#a9b5bf;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#f8fbfd 0,#eef3f7 100%);color:var(--ink)}
a{color:inherit}
button,input,textarea,select{font:inherit}
.container{max-width:1260px;margin:auto;padding:0 24px}
.site-header{position:sticky;top:0;z-index:50;background:rgba(19,46,70,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1)}
.navbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{text-decoration:none;color:white;display:flex;align-items:center;gap:12px;min-width:0}
.logo-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#f5bd65);display:grid;place-items:center;color:#173247;font-weight:900;box-shadow:0 7px 18px rgba(228,154,52,.25)}
.logo strong{display:block;line-height:1.05}.logo small{display:block;color:#bcd0df;margin-top:3px;font-size:.76rem}
.navlinks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.navlinks a{color:#e7f0f6;text-decoration:none;padding:9px 11px;border-radius:9px;font-size:.9rem;font-weight:650}
.navlinks a:hover{background:rgba(255,255,255,.1)}
.hero{position:relative;overflow:hidden;background:linear-gradient(125deg,#102a41 0%,#1d5877 56%,#287f94 100%);color:white;padding:76px 0 70px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(0);opacity:.16;pointer-events:none}
.hero:before{width:500px;height:500px;background:#7fd0dc;right:-160px;top:-260px}
.hero:after{width:360px;height:360px;background:#f5b657;left:-130px;bottom:-250px}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:44px;align-items:center}
.kicker{font-size:.76rem;letter-spacing:.16em;font-weight:850;color:#bfe4ee;margin-bottom:14px}
.hero h1{font-size:clamp(2.3rem,5vw,4.6rem);line-height:.98;margin:0 0 22px;max-width:780px;letter-spacing:-.045em}
.hero p{font-size:1.08rem;line-height:1.7;color:#dcebf2;max-width:720px;margin:0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:11px;padding:11px 16px;border:1px solid transparent;text-decoration:none;font-weight:800;cursor:pointer;transition:.2s transform,.2s box-shadow,.2s background}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);color:#182d3e;box-shadow:0 10px 24px rgba(228,154,52,.25)}
.btn.ghost{border-color:rgba(255,255,255,.35);color:white;background:rgba(255,255,255,.08)}
.hero-card{position:relative;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);backdrop-filter:blur(10px);border-radius:20px;padding:24px;box-shadow:0 22px 55px rgba(7,26,40,.22)}
.hero-card .label{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:#bfe4ee;font-weight:850}
.hero-card h2{font-size:1.55rem;margin:8px 0 10px}.hero-card p{font-size:.95rem;line-height:1.55}
.hero-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.meta{border-radius:12px;background:rgba(0,0,0,.13);padding:12px}.meta strong{display:block;font-size:.78rem;color:#bfe4ee;margin-bottom:5px}.meta span{font-size:.88rem}
.wave{height:28px;background:linear-gradient(to right bottom,transparent 49%,var(--bg) 50%);margin-top:-1px}

.section{padding:64px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}
.section-head .eyebrow{font-size:.76rem;font-weight:850;letter-spacing:.11em;color:var(--blue);text-transform:uppercase}
.section-head h2{font-size:clamp(1.65rem,3vw,2.5rem);margin:5px 0 0;letter-spacing:-.025em}
.section-head p{max-width:580px;color:var(--muted);line-height:1.6;margin:0}
.room-shell{position:relative;border-radius:22px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 20px 60px rgba(31,56,75,.12)}
.room-svg{display:block;width:100%;height:auto}
.room-image{width:100%}
.hotspot{position:absolute;border:2px solid transparent;background:transparent;border-radius:14px;cursor:pointer}
.hotspot:hover,.hotspot:focus{outline:none;border-color:#fff;box-shadow:0 0 0 4px rgba(228,154,52,.75),0 12px 30px rgba(0,0,0,.12);background:rgba(255,255,255,.08)}
.hotspot::after{content:attr(data-label);position:absolute;left:50%;bottom:10px;transform:translateX(-50%) translateY(4px);padding:7px 10px;border-radius:999px;background:rgba(19,46,70,.96);color:white;font-size:.75rem;font-weight:800;white-space:nowrap;opacity:0;transition:.2s}
.hotspot:hover::after,.hotspot:focus::after{opacity:1;transform:translateX(-50%) translateY(0)}
.hs-board{left:22.5%;top:20%;width:52%;height:40%}.hs-pin{left:4%;top:20%;width:16%;height:36%}.hs-cabinet{left:77%;top:18%;width:19%;height:47%}.hs-door{left:1%;top:58%;width:15%;height:38%}.hs-desk{left:28%;top:59%;width:45%;height:34%}.hs-year{left:77%;top:69%;width:19%;height:24%}

.current-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.current-card,.next-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:24px;position:relative;overflow:hidden}
.current-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.current-card h3,.next-card h3{margin:4px 0 10px;font-size:1.45rem}
.current-card p,.next-card p{color:var(--muted);line-height:1.6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{font-size:.78rem;padding:7px 9px;background:var(--soft);border-radius:999px;color:var(--blue);font-weight:750}
.next-card{background:linear-gradient(145deg,#173a53,#275e79);color:#fff;border:0}.next-card p{color:#d8e8f0}

.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.quick-card{position:relative;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:150px;transition:.2s transform,.2s box-shadow,.2s border}
.quick-card:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(28,58,78,.12);border-color:#b9ceda}
.quick-icon{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.3rem;margin-bottom:18px}
.quick-card strong{font-size:1.05rem;display:block;margin-bottom:6px}.quick-card span{color:var(--muted);font-size:.9rem;line-height:1.45}
.quick-arrow{position:absolute;right:18px;top:20px;color:var(--blue);font-weight:900}

.journey-track{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.block-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;min-height:160px;transition:.2s transform,.2s box-shadow}
.block-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(28,58,78,.10)}
.block-card.done{border-top:5px solid var(--green)}.block-card.current{border-top:5px solid var(--accent);box-shadow:0 0 0 2px rgba(228,154,52,.1)}.block-card.future{border-top:5px solid var(--future);opacity:.82}
.block-card .eyebrow{font-size:.72rem;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.block-card h3{font-size:1rem;margin:7px 0}.block-card p{font-size:.85rem;color:var(--muted);line-height:1.45;margin:0 0 15px}
.block-card a{text-decoration:none;font-size:.85rem;color:var(--blue);font-weight:800}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.84rem;margin-top:16px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.done-dot{background:var(--green)}.current-dot{background:var(--accent)}.future-dot{background:var(--future)}

.cta{margin:18px auto 64px;max-width:1260px;padding:0 24px}
.cta-inner{background:linear-gradient(110deg,#132e46,#266882);border-radius:22px;color:#fff;padding:32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.cta h2{margin:0 0 7px}.cta p{margin:0;color:#d9e7ee}.cta .btn{flex:0 0 auto}

.footer{background:#0f273a;color:#aac0cf;padding:34px 0}.footer-row{display:flex;justify-content:space-between;gap:16px;align-items:center}.footer a{color:#d5e4ed}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}.reveal.visible{opacity:1;transform:none}

.modal{border:0;border-radius:18px;padding:0;max-width:570px;width:calc(100% - 32px);box-shadow:0 30px 90px rgba(0,0,0,.28)}
.modal::backdrop{background:rgba(11,28,41,.62);backdrop-filter:blur(3px)}
.modal-head{background:var(--navy);color:white;padding:18px 20px;display:flex;justify-content:space-between;gap:10px;align-items:center}.modal-head h2{margin:0;font-size:1.2rem}.modal-head button{border:0;background:transparent;color:white;font-size:1.5rem;cursor:pointer}
.modal-body{padding:21px}.modal-body p{color:var(--muted);line-height:1.6}.modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.modal-actions .btn{background:var(--blue);color:#fff}.modal-actions .secondary{background:var(--soft);color:var(--blue);border-color:var(--line)}

@media(max-width:980px){.hero-grid,.current-grid{grid-template-columns:1fr}.journey-track{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:55px}.navlinks a:nth-child(2),.navlinks a:nth-child(3){display:none}}
@media(max-width:620px){.container{padding:0 15px}.navbar{min-height:64px}.logo small{display:none}.navlinks a{font-size:.8rem;padding:8px}.hero{padding:45px 0}.hero-card{padding:18px}.hero-meta{grid-template-columns:1fr}.section{padding:45px 0}.section-head{align-items:flex-start;flex-direction:column}.journey-track,.quick-grid{grid-template-columns:1fr}.cta{padding:0 15px}.cta-inner{align-items:flex-start;flex-direction:column}.hotspot::after{display:none}.footer-row{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.quick-card,.block-card,.btn{transition:none}}

</style></head>
<body><header class="site-header"><div class="container navbar"><a class="logo" href="index.html"><span class="logo-mark">LH</span><span><strong>Blockwoche</strong><small>Etappe der Jahresreise</small></span></a><nav class="navlinks"><a href="index.html">← Klassenzimmer</a><a href="editor.html">Bearbeiten</a></nav></div></header>
<main class="container" style="padding-top:42px;padding-bottom:70px">
<section class="current-card"><div class="kicker" style="color:var(--accent)" id="bwLabel"></div><h3 id="bwTitle"></h3><p id="bwTopic"></p><div class="hero-actions" id="bwActions"></div></section>
<section class="section" style="padding-bottom:0"><div class="section-head"><div><div class="eyebrow">Jahresreise</div><h2>Blockwoche wechseln</h2></div><p>Wähle eine andere Etappe aus.</p></div><div class="journey-track" id="journey"></div></section>
</main>
<script src="config.js"></script><script>
(()=>{const cfg=window.CLASSROOM_CONFIG,p=new URLSearchParams(location.search),nr=Number(p.get("bw")||cfg.currentBlock),b=cfg.blocks.find(x=>x.nr===nr)||cfg.blocks[0],placeholder=u=>!u||/DEIN-|DEINE-/i.test(u);
document.getElementById("bwLabel").textContent=b.short;document.getElementById("bwTitle").textContent=b.title;document.getElementById("bwTopic").textContent=b.topic;
[["Mebis",b.mebis],["Cloud / Material",b.cloud],["Lernlandkarte",b.lernlandkarte],["Tafelbild",b.tafelbild]].forEach(([label,url])=>{const a=document.createElement("a");a.className="btn primary";a.textContent=label;a.href=placeholder(url)?"editor.html":url;if(!placeholder(url)){a.target="_blank";a.rel="noopener noreferrer"}document.getElementById("bwActions").appendChild(a)});
cfg.blocks.forEach(x=>{const c=document.createElement("article");c.className=`block-card ${x.status||"future"}`;c.innerHTML=`<div class="eyebrow">${x.short}</div><h3>${x.title}</h3><p>${x.topic}</p><a href="?bw=${x.nr}">Öffnen →</a>`;document.getElementById("journey").appendChild(c)});})();
</script></body></html>
