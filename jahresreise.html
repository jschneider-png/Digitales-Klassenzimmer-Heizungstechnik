<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jahresreise MSH12</title>
<style>
:root{
  --bg:#eef4f8;
  --navy:#102c43;
  --blue:#23658b;
  --accent:#ee9b32;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:#172634;
}
header{
  background:var(--navy);
  color:white;
  padding:18px 20px;
  text-align:center;
}
header h1{margin:0 0 4px;font-size:clamp(1.6rem,4vw,2.5rem)}
header p{margin:0;color:#c9dce7}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:22px;
}
.hint{
  background:white;
  border-left:5px solid var(--accent);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:18px;
  line-height:1.5;
}
.poster{
  position:relative;
  width:100%;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 18px 50px rgba(22,47,65,.14);
}
.poster img{
  width:100%;
  display:block;
}
.hotspot{
  position:absolute;
  display:block;
  border:3px solid transparent;
  border-radius:16px;
  transition:.18s ease;
}
.hotspot:hover,
.hotspot:focus{
  border-color:white;
  box-shadow:0 0 0 5px rgba(238,155,50,.82), 0 10px 22px rgba(0,0,0,.18);
  outline:none;
}

/*
==========================================================
NUR HIER DIE LINKS UND BEI BEDARF DIE POSITIONEN ÄNDERN.
Die Koordinaten sind Prozentwerte relativ zum Poster.
==========================================================
*/

/* BW 1 */
.bw1  { left:28%; top:11.5%; width:24%; height:8%; }
/* BW 2 */
.bw2  { left:55%; top:13%; width:25%; height:8%; }
/* BW 3 */
.bw3  { left:67%; top:22%; width:27%; height:10%; }
/* BW 4 */
.bw4  { left:19%; top:23.5%; width:23%; height:8.5%; }
/* BW 5 */
.bw5  { left:69%; top:33%; width:24%; height:8.5%; }
/* BW 6 */
.bw6  { left:10%; top:35.5%; width:24%; height:8.5%; }
/* BW 7 */
.bw7  { left:71%; top:43.5%; width:24%; height:8.5%; }
/* BW 8 */
.bw8  { left:10%; top:46%; width:24%; height:8.5%; }
/* BW 9 */
.bw9  { left:64%; top:53%; width:25%; height:9%; }
/* BW 10 */
.bw10 { left:10%; top:56.5%; width:27%; height:8.5%; }
/* BW 11 */
.bw11 { left:29%; top:64%; width:29%; height:8%; }
/* BW 12 */
.bw12 { left:54%; top:71%; width:28%; height:8.5%; }

footer{
  text-align:center;
  padding:18px;
  color:#667886;
  font-size:.88rem;
}
@media(max-width:700px){
  .wrap{padding:10px}
  .hotspot{border-radius:8px}
}
</style>
</head>
<body>

<header>
  <h1>Jahresreise MSH12</h1>
  <p>12 Blockwochen · 12 Lernstationen · ein roter Faden</p>
</header>

<main class="wrap">
  <div class="hint">
    Klicke auf eine Blockwoche. Jeder Bereich kann später mit einer
    Lernlandkarte, Mebis-Seite, Cloud-Datei oder einem virtuellen Lernraum verlinkt werden.
  </div>

  <div class="poster">
    <img src="jahresreise-msh12.png" alt="Jahresreise MSH12 mit zwölf Blockwochen">

    <!-- =======================================================
         HIER NUR DIE href-ADRESSEN ÄNDERN.
         Beispiel:
         href="https://mebis.bycs.de/DEIN-LINK"
         ======================================================= -->

    <a class="hotspot bw1"
       href="#"
       aria-label="Blockwoche 1 – Ankommen und Grundlagen"></a>

    <a class="hotspot bw2"
       href="#"
       aria-label="Blockwoche 2 – Wärme und Energie"></a>

    <a class="hotspot bw3"
       href="#"
       aria-label="Blockwoche 3 – Brennstoffe"></a>

    <a class="hotspot bw4"
       href="#"
       aria-label="Blockwoche 4 – Wärmeerzeuger"></a>

    <a class="hotspot bw5"
       href="#"
       aria-label="Blockwoche 5 – Hydraulik"></a>

    <a class="hotspot bw6"
       href="#"
       aria-label="Blockwoche 6 – Wärmeverteilung"></a>

    <a class="hotspot bw7"
       href="#"
       aria-label="Blockwoche 7 – Trinkwasser"></a>

    <a class="hotspot bw8"
       href="#"
       aria-label="Blockwoche 8 – Regelung"></a>

    <a class="hotspot bw9"
       href="#"
       aria-label="Blockwoche 9 – Erneuerbare Wärme"></a>

    <a class="hotspot bw10"
       href="#"
       aria-label="Blockwoche 10 – Anlagenoptimierung"></a>

    <a class="hotspot bw11"
       href="#"
       aria-label="Blockwoche 11 – Prüfungsvorbereitung"></a>

    <a class="hotspot bw12"
       href="#"
       aria-label="Blockwoche 12 – Transfer und Abschluss"></a>
  </div>
</main>

<footer>
  MSH12 · Heizungstechnik · Interaktive Jahresreise
</footer>

</body>
</html>
